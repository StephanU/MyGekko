name: "Release"

# Every change of the integration on main creates a GitHub release with an automatic version:
#   - the manifest version, if it is newer than the latest release tag (e.g. a manual 1.5.0 bump),
#   - otherwise the latest release tag with the patch number increased (1.4.0 -> 1.4.1).
# Release notes: `.github/release-notes/<version>.md` if present, else generated from the commits.
on:
  push:
    branches:
      - main
    paths:
      - "custom_components/**"
      - "hacs.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "Release"
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0

      - name: "Determine the version"
        id: version
        shell: "bash"
        run: |
          manifest=$(jq -r .version custom_components/mygekko/manifest.json)
          if ! echo "$manifest" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "manifest version '$manifest' is not x.y.z" >&2
            exit 1
          fi
          latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            next="$manifest"
          elif [ "$(printf '%s\n%s\n' "$latest" "$manifest" | sort -V | tail -n 1)" = "$manifest" ] \
               && [ "$manifest" != "$latest" ]; then
            next="$manifest"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Latest tag: ${latest:-none}, manifest: $manifest, new version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: "Adjust version number"
        shell: "bash"
        run: |
          jq '.version = "${{ steps.version.outputs.version }}"' \
            custom_components/mygekko/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/mygekko/manifest.json
          sed -i 's/^VERSION = ".*"/VERSION = "${{ steps.version.outputs.version }}"/' \
            custom_components/mygekko/const.py

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd custom_components/mygekko
          zip mygekko_integration.zip -r ./

      - name: "Pick the release notes"
        id: notes
        shell: "bash"
        run: |
          file=".github/release-notes/${{ steps.version.outputs.version }}.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; fi

      - name: "Create the release"
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: "${{ steps.version.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ steps.version.outputs.version }}"
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          make_latest: true
          files: custom_components/mygekko/mygekko_integration.zip
