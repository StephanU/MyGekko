name: "Release"

# Push a version tag (for example `git tag 1.4.0 && git push origin 1.4.0`): the workflow
# creates the GitHub release with notes and the integration zip.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Adjust version number"
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ github.ref_name }}"' \
            "${{ github.workspace }}/custom_components/mygekko/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/mygekko"
          zip mygekko_integration.zip -r ./

      - name: "Pick the release notes"
        id: notes
        shell: "bash"
        run: |
          file=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; fi

      - name: "Create the release"
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: "${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ github.workspace }}/custom_components/mygekko/mygekko_integration.zip
